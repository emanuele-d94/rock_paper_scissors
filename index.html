<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Rock Paper Scissor</h1>
        </div>
        <div class="score">
            <div class="score-top">
                <div class="round">
                    <h2>Round</h2>
                    <p>1</p>
                </div>
            </div>
            <div class="score-bottom">
                <div class="score-user">
                    <h2>Your Score</h2>
                    <p>0</p>
                </div>
                <div class="score-computer">
                    <h2>Computer Score</h2>
                    <p>0</p>
                </div>
            </div>
        </div>
        <div class="game">
            <div class="game-user">
                <div class="game-user-top">
                    <h2>Your choice</h2>
                </div>
                <div class="game-user-bottom">
                    <button class="user-rock">Rock</button>
                    <button class="user-paper">Paper</button>
                    <button class="user-scissor">Scissor</button>
                </div>
            </div>
            <div class="game-computer">
                <div class="game-computer-top">
                    <h2>Computer choice</h2>
                </div>
                <div class="game-computer-bottom">
                    <button class="computer-rock">Rock</button>
                    <button class="computer-paper">Paper</button>
                    <button class="computer-scissor">Scissor</button>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
